version: "3"

# [LEGACY / OPCIONAL] Túneles ngrok para Iron Gym (API + Flutter Web).
# Fase 18: preferir LAN (`scripts/run-lan-dev.ps1`) o Cloudflare Tunnel.
#
# IMPORTANTE: este archivo NO incluye authtoken (no va al repo).
# Usa el script que combina configs:
#   .\scripts\start-ngrok-gym.ps1
#
# O manualmente:
#   ngrok start --config $env:LOCALAPPDATA\ngrok\ngrok.yml --config scripts/ngrok-gym.yml api web

tunnels:
  api:
    addr: 3000
    proto: http
  web:
    addr: 8888
    proto: http
    # Puerto 8888: 8080/8088/8089 están reservados por Hyper-V en Windows.
    host_header: "localhost:8888"
